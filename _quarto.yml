project:
  type: book
  resources:
    - fonts/

book:
  title: "Statistics and Data Analysis"
  subtitle: "A broad perspective for social and health scientists — Draft 0.6"
  author: "Daniel Oberski"
  date: today
  output-file: "stads-book"
  chapters:
    - index.qmd
    - 01-research-question-to-interpretation.qmd
    - 02-theory-to-linear-models.qmd
    - 03-identification-mediation.qmd
    - 04-anova.qmd
    - 05-explanation-prediction.qmd
    - 06-overfitting-bias-variance.qmd
    - 07-evaluation-resampling.qmd
    - references.qmd

bibliography: references.bib
csl: apa.csl

format:
  html:
    theme: cosmo
    css: fonts/fonts.css
    mainfont: "Fira Sans"
    monofont: "Fira Code"
    toc: true
    number-sections: true
    code-fold: false
    fig-width: 6
    fig-height: 4
  pdf:
    documentclass: scrbook
    classoption: [twoside, openright]
    pdf-engine: xelatex
    mainfont: "Fira Sans"
    sansfont: "Fira Sans"
    monofont: "Fira Code"
    monofontoptions:
      - Scale=0.82
    fontsize: 10pt
    linestretch: 1.15
    geometry:
      - paperwidth=6in
      - paperheight=9in
      - inner=0.875in
      - outer=0.625in
      - top=0.8in
      - bottom=0.9in
      - marginparwidth=0in
    toc: true
    toc-depth: 2
    number-sections: true
    colorlinks: true
    linkcolor: "black"
    citecolor: "black"
    urlcolor: "black"
    fig-width: 4.5
    fig-height: 3.2
    fig-format: png
    fig-dpi: 300
    include-in-header:
      text: |
        % ragged-right footnotes and tighter lists for the narrow page
        \usepackage[hang,flushmargin]{footmisc}
        \KOMAoptions{parskip=false}
        \setlength{\emergencystretch}{3em}
        % keep code blocks from overflowing the 6in page
        \ifdefined\Shaded
          \renewenvironment{Shaded}{\begin{snugshade}\small}{\end{snugshade}}
        \fi

execute:
  echo: true
  warning: false
  message: false
  freeze: auto
