project:
  type: book
  output-dir: _book
  resources:
    - fonts/*.woff2
    - fonts/fonts.css

book:
  title: "Statistics and Data Analysis"
  subtitle: "A broad perspective for social and health scientists — Draft 0.7"
  author: "Daniel Oberski"
  date: today
  output-file: "stads-book"
  site-url: https://daob.github.io/stads-book/
  repo-url: https://github.com/daob/stads-book
  repo-branch: main
  repo-actions: [edit, source, issue]
  downloads: [pdf, epub]
  search: true
  sidebar:
    style: docked
  page-footer:
    left: "© 2026 Daniel Oberski"
    center: "Text CC BY-NC-SA 4.0 · code MIT"
    right: "[Source](https://github.com/daob/stads-book)"
  chapters:
    - index.qmd
    - 01-research-question-to-interpretation.qmd
    - 02-theory-to-linear-models.qmd
    - 03-identification-mediation.qmd
    - 04-anova.qmd
    - 05-explanation-prediction.qmd
    - 06-overfitting-bias-variance.qmd
    - 07-evaluation-resampling.qmd
    - 08-unsupervised-clustering-mixtures.qmd
    - references.qmd

bibliography: references.bib
csl: apa.csl

format:
  html:
    theme: cosmo
    css: fonts/fonts.css
    mainfont: "Fira Sans"
    monofont: "Fira Code"
    toc: true
    number-sections: true
    code-fold: false
    fig-width: 6
    fig-height: 4
  pdf:
    documentclass: scrbook
    classoption: [twoside, openright]
    pdf-engine: xelatex
    mainfont: "Fira Sans"
    sansfont: "Fira Sans"
    monofont: "Fira Code"
    monofontoptions:
      - Scale=0.82
    fontsize: 10pt
    linestretch: 1.15
    geometry:
      - paperwidth=6in
      - paperheight=9in
      - inner=0.875in
      - outer=0.625in
      - top=0.8in
      - bottom=0.9in
      - marginparwidth=0in
    toc: true
    toc-depth: 2
    number-sections: true
    colorlinks: true
    linkcolor: "black"
    citecolor: "black"
    urlcolor: "black"
    fig-width: 4.5
    fig-height: 3.2
    fig-format: png
    fig-dpi: 300
    include-in-header:
      text: |
        % ragged-right footnotes and tighter lists for the narrow page
        \usepackage[hang,flushmargin]{footmisc}
        \KOMAoptions{parskip=false}
        \setlength{\emergencystretch}{3em}
        % keep code blocks from overflowing the 6in page
        \ifdefined\Shaded
          \renewenvironment{Shaded}{\begin{snugshade}\small}{\end{snugshade}}
        \fi
  epub:
    toc: true
    number-sections: true
    fig-width: 6
    fig-height: 4
    epub-fonts:
      - fonts/FiraSans-Regular.woff2
      - fonts/FiraSans-Italic.woff2
      - fonts/FiraSans-Bold.woff2
      - fonts/FiraSans-BoldItalic.woff2

execute:
  echo: true
  warning: false
  message: false
  freeze: auto
