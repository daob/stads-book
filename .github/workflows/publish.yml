name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, write only the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; queue rather than cancel, so a merge train
# still publishes its last commit.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Render the book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run repository checks
        run: make test

      # The PDF is typeset in Fira Sans and Fira Code. The fonts ship with the
      # repository (fonts/print/, SIL OFL 1.1), so the build does not depend on
      # what this runner happens to have installed.
      - name: Install the book's fonts
        run: |
          mkdir -p ~/.local/share/fonts
          cp fonts/print/*.ttf ~/.local/share/fonts/
          fc-cache -f
          fc-list | grep -c "Fira" || (echo "::error::Fira fonts not registered" && exit 1)

      # Quarto detects the knitr engine before it consults the freeze, so R has
      # to exist on the runner — but only base R: no package and no data file
      # is read, because every chunk's output comes from _freeze/.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # Turns GitHub Pages on for this repository the first time the workflow
      # runs, so no one has to visit Settings → Pages by hand. It also supplies
      # the base URL the deploy step reports back.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      # No R here on purpose: every code chunk's output is committed in
      # _freeze/, so rendering needs neither the R packages nor the LISS
      # microdata. tests/check_freeze.py fails the build if that ever stops
      # being true.
      - name: Render HTML, PDF, EPUB and the answers-in-back PDF
        run: make ci-build

      - name: Check the expected outputs exist
        run: |
          for f in index.html stads-book.pdf stads-book.epub \
                   stads-book-answers-in-back.pdf; do
            test -s "_book/$f" || (echo "::error::_book/$f missing or empty" && exit 1)
          done
          du -sh _book

      - name: Mark the site as static (no Jekyll processing)
        run: touch _book/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
